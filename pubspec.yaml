name: noteep
description: "A digital notebook of tasks."
publish_to: "none"
version: 2.0.0+2

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  # UI & Styling
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  uuid: ^4.5.1
  shared_preferences: ^2.3.4
  intl: ^0.19.0
  pdf: ^3.11.1
  printing: ^5.13.1
  path_provider: ^2.1.4
  table_calendar: ^3.1.3

  # Firebase
  firebase_core: ^3.13.1
  firebase_auth: ^5.5.3
  google_sign_in: ^6.2.2
  cloud_firestore: ^5.6.6

  # Backup & Storage
  archive: ^3.6.1
  background_fetch: ^1.3.0

  # Notifications & Reminders
  flutter_local_notifications: ^18.0.1
  flutter_timezone: ^3.0.0
  timezone: ^0.9.4

  # Share
  share_plus: ^10.1.4

  # File Picker
  file_picker: ^8.1.7

  # Markdown
  flutter_markdown: ^0.7.6

  # Charts
  fl_chart: ^0.68.0

  # Biometric / Note Lock
  local_auth: ^2.3.0

  # Home Widget
  home_widget: ^0.9.1

  # Audio
  record: ^6.0.0
  just_audio: ^0.9.39
  audio_waveforms: ^1.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.1
  fake_cloud_firestore: ^3.1.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/images/

  fonts:
    - family: Exo 2
      fonts:
        - asset: assets/fonts/Exo2-var.ttf
        - asset: assets/fonts/Exo2-Italic-var.ttf
          style: italic

    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-var.ttf
        - asset: assets/fonts/Montserrat-Italic-var.ttf
          style: italic

    - family: Open Sans
      fonts:
        - asset: assets/fonts/OpenSans-var.ttf
        - asset: assets/fonts/OpenSans-Italic-var.ttf
          style: italic

    - family: Dancing Script
      fonts:
        - asset: assets/fonts/DancingScript-var.ttf

    - family: Playfair Display
      fonts:
        - asset: assets/fonts/PlayfairDisplay-var.ttf
        - asset: assets/fonts/PlayfairDisplay-Italic-var.ttf
          style: italic

    - family: Pacifico
      fonts:
        - asset: assets/fonts/Pacifico-Regular.ttf
